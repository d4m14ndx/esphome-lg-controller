esphome:
  name: ${deviceid}
  friendly_name: ${devicename}

esp32:
  board: esp32dev
  # For the FeatherS3, uncomment the next two lines and remove the line above.
  #board: um_feathers3
  #variant: esp32s3
  framework:
    type: esp-idf

#esp32_ble_tracker:
#  scan_parameters:
#    active: false

#bluetooth_proxy:
#  active: false

uart:
  - id: ac_serial
    # For the FeatherS3, use GPIO18
    tx_pin: GPIO25
    rx_pin:
      # For the FeatherS3, use GPIO17
      number: GPIO26 # Keep in sync with rx_pin below.
      allow_other_uses: true
    baud_rate: 104

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - id: temp_sensor
    platform: homeassistant
    internal: true
    entity_id: ${temperature_sensor_entity_id}
  - platform: uptime
    type: timestamp
    name: Last Boot

external_components:
  - source:
      type: git
      url: https://github.com/d4m14ndx/esphome-lg-controller
      ref: main
      path: esphome
    components: [lg_controller]

climate:
  - platform: lg_controller
    name: ""
    id: ${deviceid}
    uart_id: ac_serial
    rx_pin:
      # For the FeatherS3, use GPIO17
      number: GPIO26 # Keep in sync with rx_pin above.
      allow_other_uses: true
    fahrenheit: ${fahrenheit}
    is_slave_controller: ${is_slave_controller}
    zone_count: ${zone_count}
    type_b_refresh_interval: ${type_b_refresh_interval}
    initial_type_b_retries: 2
    respond_to_type4: true
    temperature_sensor: temp_sensor
    vane1:
