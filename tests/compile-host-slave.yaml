esphome:
  name: lg-controller-host-slave

host:

logger:

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [lg_controller]

uart:
  - id: ac_serial
    port: /dev/null
    baud_rate: 110

climate:
  - platform: lg_controller
    id: lg_controller_slave
    name: LG Controller Host Slave
    uart_id: ac_serial
    rx_pin: 0
    fahrenheit: false
    is_slave_controller: true

    vane1: {id: slave_vane1, internal: true}
    vane2: {id: slave_vane2, internal: true}
    vane3: {id: slave_vane3, internal: true}
    vane4: {id: slave_vane4, internal: true}
    overheating: {id: slave_overheating, internal: true}

    fan_speed_slow: {id: slave_fan_slow, internal: true}
    fan_speed_low: {id: slave_fan_low, internal: true}
    fan_speed_medium: {id: slave_fan_medium, internal: true}
    fan_speed_high: {id: slave_fan_high, internal: true}
    sleep_timer: {id: slave_sleep_timer, internal: true}

    error_code: {id: slave_error_code, internal: true}
    pipe_temp_in: {id: slave_pipe_temp_in, internal: true}
    pipe_temp_mid: {id: slave_pipe_temp_mid, internal: true}
    pipe_temp_out: {id: slave_pipe_temp_out, internal: true}

    defrost: {id: slave_defrost, internal: true}
    preheat: {id: slave_preheat, internal: true}
    outdoor: {id: slave_outdoor, internal: true}
    auto_dry_active: {id: slave_auto_dry_active, internal: true}

    purifier: {id: slave_purifier, internal: true}
    internal_thermistor: {id: slave_internal_thermistor, internal: true}
    auto_dry: {id: slave_auto_dry, internal: true}

    # Controls and telemetry for the remaining documented protocol fields.
    capabilities: {id: slave_capabilities, internal: true}
    thermistor_2th_switch: {id: slave_thermistor_2th_switch, internal: true}
    power: {id: slave_power, internal: true}
    zone_type_new: {id: slave_zone_type_new, internal: true}
    auto_addressing: {id: slave_auto_addressing, internal: true}
    humidifier_switch: {id: slave_humidifier_switch, internal: true}
    auxiliary_heater_switch: {id: slave_auxiliary_heater_switch, internal: true}
    swirl_switch: {id: slave_swirl_switch, internal: true}
    ventilation_switch: {id: slave_ventilation_switch, internal: true}
    fan_auto_switch: {id: slave_fan_auto_switch, internal: true}
    energy_saving_switch: {id: slave_energy_saving_switch, internal: true}
    robot_clean_auto_switch: {id: slave_robot_clean_auto_switch, internal: true}
    wifi_ap_switch: {id: slave_wifi_ap_switch, internal: true}
    dual_setpoint_switch: {id: slave_dual_setpoint_switch, internal: true}
    himalaya_cooling_switch: {id: slave_himalaya_cooling_switch, internal: true}
    mosquito_away_switch: {id: slave_mosquito_away_switch, internal: true}
    comfort_cooling_switch: {id: slave_comfort_cooling_switch, internal: true}
    auxiliary_heater_installed_switch: {id: slave_auxiliary_heater_installed_switch, internal: true}
    dry_contact_auto_switch: {id: slave_dry_contact_auto_switch, internal: true}
    zone_state_fixed_switch: {id: slave_zone_state_fixed_switch, internal: true}
